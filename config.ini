[settings]
# Change these to whichever keys feel comfortable.
# Examples: f6, f7, f8, f9, f10, home, end, insert, delete
toggle_key = f6
quit_key = f12

# Set to 8-24 for a tiny random delay, or off for instant pressing.
delay_ms = off

# Leave these alone unless you are tuning detection.
fps = 60
press_cooldown = 0.35
inside_margin_deg = 0
ring_min_ratio = 0.55
ring_max_ratio = 1.35
debug = false
dry_run = false
